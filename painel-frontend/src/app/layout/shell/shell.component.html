<div class="shell">
  <header class="topnav">
    <div class="topnav-brand">
      <svg class="brand-logo" viewBox="0 -4 176 56" fill="none" role="img" aria-label="S.A.G.E.">
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="15" y1="24" x2="35" y2="24" />
          <path d="M30.5 18 L37 24 L30.5 30" />
          <line x1="53" y1="24" x2="128" y2="24" />
          <path d="M127.5 18 L134 24 L127.5 30" />
        </g>
        <path
          d="M102.62 19.66 A25 25 0 1 0 102.62 28.34"
          stroke="currentColor"
          stroke-width="3.4"
          stroke-linecap="round"
        />
        <circle cx="8" cy="24" r="5.5" fill="currentColor" />
        <circle cx="78" cy="24" r="6" fill="currentColor" />
        <circle cx="152" cy="24" r="8" stroke="currentColor" stroke-width="5.2" />
        <circle cx="152" cy="24" r="1.9" fill="currentColor" />
        <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <line x1="152" y1="8" x2="152" y2="12" />
          <line x1="152" y1="36" x2="152" y2="40" />
          <line x1="136" y1="24" x2="140" y2="24" />
          <line x1="164" y1="24" x2="168" y2="24" />
        </g>
      </svg>
    </div>

    <nav class="topnav-links">
      <div class="nav-group">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Dashboard</a
        >
      </div>

      <span class="nav-divider"></span>

      <div class="nav-group">
        <a routerLink="/modulos" routerLinkActive="active">Módulos</a>
        <a routerLink="/conhecimentos" routerLinkActive="active">Conhecimentos</a>
        <a routerLink="/funcoes" routerLinkActive="active">Funções</a>
      </div>

      @if (isMaster()) {
        <span class="nav-divider"></span>

        <div class="nav-group">
          <a routerLink="/chat-teste" routerLinkActive="active">Simular atendimento</a>
          <a routerLink="/usuarios" routerLinkActive="active">Usuários</a>
          <a routerLink="/chaves-acesso" routerLinkActive="active">Chaves de acesso</a>
        </div>
      }

      <span class="nav-divider"></span>

      <div class="nav-group">
        <a routerLink="/conversas" routerLinkActive="active">Conversas</a>
        <a routerLink="/execucoes" routerLinkActive="active">Execuções</a>
      </div>
    </nav>

    <div class="topnav-actions">
      <a class="topbar-user" routerLink="/perfil" routerLinkActive="active">
        <span class="user-avatar">{{ currentUser()?.name?.charAt(0) }}</span>
        <div>
          <div class="user-name">{{ currentUser()?.name }}</div>
          <div class="user-role">{{ isMaster() ? 'Gerente' : 'Usuário comum' }}</div>
        </div>
      </a>
      <button class="btn btn-secondary" (click)="logout()">Sair</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
