<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-brand">
      <img class="login-logo" src="logo-sage.svg" alt="Logo S.A.G.E." />
      <h1>S.A.G.E.</h1>
    </div>
    <p class="subtitle">Painel de Gestão do Conhecimento</p>

    <div class="form-field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="field-error">Informe um e-mail válido.</p>
      }
    </div>

    <div class="form-field">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="field-error">Informe a senha.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
